plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.nexusmusic'
version = '0.1.0'

def syncSharedAssets = tasks.register('syncNexusSharedAssets', Copy) {
  from(file('../common/bootstrap.js'), file('../common/react-17.0.2.min.js'), file('../common/react-dom-17.0.2.min.js'))
  into(layout.buildDirectory.dir('generated/nexus-assets'))
}

android {
  namespace 'com.nexusmusic.nexusnative'

  defaultConfig {
    minSdkVersion 29
    versionCode 1
    versionName '0.1.0'

    externalNativeBuild {
      cmake {
        cppFlags '-std=c++20 -O2'
      }
    }
  }

  sourceSets {
    main {
      assets.srcDirs += [layout.buildDirectory.dir('generated/nexus-assets')]
    }
  }

  externalNativeBuild {
    cmake {
      path file('src/main/cpp/CMakeLists.txt')
      version '3.22.1'
    }
  }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
  dependsOn(syncSharedAssets)
}

dependencies {
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'androidx.media3:media3-exoplayer:1.5.1'
  implementation 'androidx.media3:media3-session:1.5.1'
  implementation 'androidx.media3:media3-datasource-okhttp:1.5.1'
  implementation 'androidx.documentfile:documentfile:1.0.1'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
