name: Android checks and APK build
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'ios/**'
      - 'modules/nexus-native/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'ios/**'
      - 'modules/nexus-native/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  # Keep the running validation; replace obsolete pending commits with the latest.
  queue: single
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run check

  android-build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: npm
      - name: Configure JDK 17 and Android SDK/NDK/CMake
        run: |
          JDK17="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          if [ ! -d "$JDK17" ]; then
            JDK17="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          fi
          echo "JAVA_HOME=$JDK17" >> "$GITHUB_ENV"
          echo "$JDK17/bin" >> "$GITHUB_PATH"
          "$JDK17/bin/java" -version
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - run: npm ci
      - name: Verify Android Expo autolinking includes nexus-native
        run: |
          node -e "const cp = require('child_process'); const out = cp.execFileSync(process.execPath, ['--no-warnings', '--eval', \"require('expo/bin/autolinking')\", 'expo-modules-autolinking', 'resolve', '--platform', 'android', '--json'], { encoding: 'utf8' }); const data = JSON.parse(out); const mod = data.modules.find(m => m.packageName === 'nexus-native'); if (!mod) throw new Error('nexus-native missing from Android autolinking'); console.log('Autolinked nexus-native modules:', mod.projects[0].modules.length);"
      - name: Run Android native unit tests and build Debug APK
        working-directory: android
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew
          ./gradlew :nexus-native:testDebugUnitTest :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "lib/arm64-v8a/libnexus_audio_dsp.so|lib/arm64-v8a/libnexus_quickjs.so|assets/bootstrap.js"
      - name: Upload Android Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: nexus-music-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
