name: iOS checks and unsigned IPA
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  # Keep the running validation; replace obsolete pending commits with the latest.
  queue: single
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run check
  ios:
    needs: checks
    runs-on: xcode-27
    # Full iPhone, offline and iPad checks exceeded the former two-hour budget.
    timeout-minutes: 180
    env:
      CI: 'true'
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      NEXUS_EXPECTED_IOS_SDK_MAJOR: '27'
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      BUNDLE_FORCE_RUBY_PLATFORM: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: npm
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3'
          bundler: '2.4.22'
          bundler-cache: true
      - name: Verify Apple Silicon and iOS 27 toolchain
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcodebuild -showsdks
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" = 27
      - run: npm ci
      - run: npm run ios:pods
      - name: Native contracts and audio processing
        run: npm run test:native
      - name: Create iOS 27 simulator
        run: node scripts/ci-simulator.mjs
      - name: Verify source management and Navidrome playback in the App
        shell: bash
        run: |
          if ! node scripts/test-ui.mjs NexusMusicUITests/SourceSettingsTests/testClassicPlayerWindowSafeArea NexusMusicUITests/SourceSettingsTests/testAM2PlayerWindowRotation NexusMusicUITests/SourceSettingsTests/testAM2PlayerWithLargeText NexusMusicUITests/SourceSettingsTests/testAMPlayerWindowRotation NexusMusicUITests/SourceSettingsTests/testAMPlayerWithLargeText NexusMusicUITests/SourceSettingsTests/testPhotoArtworkAspectAndFallback NexusMusicUITests/SourceSettingsTests/testPhotoPlayerWindowRotation NexusMusicUITests/SourceSettingsTests/testPhotoPlayerWithLargeText NexusMusicUITests/SourceSettingsTests/testAppIconOnHomeScreen NexusMusicUITests/SourceSettingsTests/testGroupedSettingsNavigationAndDrafts NexusMusicUITests/SourceSettingsTests/testGlobalCoverThemeChangesAcrossPages NexusMusicUITests/SourceSettingsTests/testAppearancePersistenceAndPrimaryNavigation NexusMusicUITests/SourceSettingsTests/testVisualImagesAndPlayerBackgroundPersistence NexusMusicUITests/SourceSettingsTests/testSourceManagerAndFilePicker NexusMusicUITests/SourceSettingsTests/testGraphicalEQPresetPersistence NexusMusicUITests/SourceSettingsTests/testEQPresetCardsWithLargeText NexusMusicUITests/SourceSettingsTests/testThemeSheetWithLargeTextAndSwipeDismissal NexusMusicUITests/SourceSettingsTests/testMiniAndNavigationSheetsWithLargeText NexusMusicUITests/SourceSettingsTests/testFontAndDisplaySheetsWithLargeText NexusMusicUITests/SourceSettingsTests/testBackgroundSheetWithLargeTextAndPersistence NexusMusicUITests/SourceSettingsTests/testPlayerStyleSheetWithLargeTextAndPersistence NexusMusicUITests/SourceSettingsTests/testFontImportAndLyricStyle NexusMusicUITests/SourceSettingsTests/testPlaylistSearchSortAndDuplicateRemoval NexusMusicUITests/SourceSettingsTests/testUCloudSyncPreviewConflictRestartAndDeletion NexusMusicUITests/SourceSettingsTests/testVCloudBackupUploadRestartPreviewRestore NexusMusicUITests/SourceSettingsTests/testWWebDAVBrowseTagsPlaybackAndRemoval NexusMusicUITests/SourceSettingsTests/testXDeviceMediaAuthorization NexusMusicUITests/SourceSettingsTests/testYLocalAudioFileImport NexusMusicUITests/SourceSettingsTests/testZNavidromePlaybackAndCredentials; then
            tail -n 100 build/logs/ui-catalog.log
            exit 1
          fi
      - name: Verify matched playback, lyrics, source health and discovery actions
        shell: bash
        run: |
          cp build/logs/ui-catalog.log build/logs/ui-core.log
          cp build/logs/ui-server-counts.json build/logs/ui-core-counts.json
          if ! node scripts/test-ui.mjs NexusMusicUITests/SourceSettingsTests/testCrossPlatformLyrics NexusMusicUITests/SourceSettingsTests/testOnlineMatching NexusMusicUITests/SourceSettingsTests/testSourceHealth NexusMusicUITests/SourceSettingsTests/testPublicComments NexusMusicUITests/SourceSettingsTests/testDiscoverySongActions; then
            tail -n 100 build/logs/ui-catalog.log
            exit 1
          fi
          cp build/logs/ui-catalog.log build/logs/ui-online-matching.log
          cp build/logs/ui-server-counts.json build/logs/ui-online-matching-counts.json
      - name: Verify offline download resume and playback with server unavailable
        shell: bash
        run: |
          if ! node scripts/test-ui.mjs NexusMusicUITests/SourceSettingsTests/testDownloadSettingsAndOfflinePlayback; then
            tail -n 100 build/logs/ui-catalog.log
            exit 1
          fi
          cp build/logs/ui-catalog.log build/logs/ui-downloads.log
          cp build/logs/ui-server-counts.json build/logs/ui-downloads-counts.json
      - name: Create native iPad simulator
        shell: bash
        run: |
          xcrun simctl shutdown "$NEXUS_SIMULATOR_ID"
          node scripts/ci-simulator.mjs 'iPad Pro 13-inch (M5)'
      - name: Verify iPad window, navigation and modal rotation
        shell: bash
        run: |
          if ! node scripts/test-ui.mjs NexusMusicUITests/SourceSettingsTests/testIPadWindowNavigationAndRotation NexusMusicUITests/SourceSettingsTests/testClassicPlayerWindowSafeArea NexusMusicUITests/SourceSettingsTests/testAM2PlayerWindowRotation NexusMusicUITests/SourceSettingsTests/testAMPlayerWindowRotation NexusMusicUITests/SourceSettingsTests/testPhotoPlayerWindowRotation; then
            tail -n 100 build/logs/ui-catalog.log
            exit 1
          fi
          cp build/logs/ui-catalog.log build/logs/ui-ipad.log
          cp build/logs/ui-server-counts.json build/logs/ui-ipad-counts.json
      - name: Archive unsigned device IPA
        shell: bash
        run: |
          mkdir -p build/logs
          set -o pipefail
          npm run ios:archive 2>&1 | tee build/logs/archive-unsigned.log
      - name: Upload IPA and verified build environment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: NexusMusic-iOS27-unsigned-${{ github.sha }}
          path: |
            build/distribution/NexusMusic-unsigned.ipa
            build/distribution/NexusMusic-unsigned.ipa.sha256
            build/distribution/build-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: ios-test-logs-${{ github.sha }}
          path: |
            build/logs/*.log
            build/logs/*summary*.json
            build/logs/*counts*.json
            build/logs/*.verification.txt
            build/logs/*.csv
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload failure screenshots and text
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: ios-failure-evidence-${{ github.sha }}
          path: build/failure-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: ios-build-diagnostics-${{ github.sha }}
          path: |
            build/logs/
            build/SourceUITests-*.xcresult
          if-no-files-found: ignore
          retention-days: 7
